# Déploiement gratuit (docs/decisions/0009-deploiement-gratuit.md). Sur render.com :
# New > Blueprint > connecter ce dépôt Git > Render lit ce fichier et provisionne
# l'API + la base PostgreSQL automatiquement, avec DATABASE_URL déjà relié.
# Les variables marquées sync: false se saisissent à la main dans le tableau de bord
# Render après la création (valeurs sensibles, jamais commitées dans le dépôt).
services:
  - type: web
    name: obp-market-api
    runtime: node
    plan: free
    rootDir: apps/api
    # --include=dev : NODE_ENV=production ferait sinon ignorer les devDependencies,
    # dont prisma (le CLI) — sans lui, npx va chercher une version au hasard sur npm.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: obp-market-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_TTL_MINUTES
        value: "5"
      - key: PRICE_WINDOW_HOURS
        value: "24"
      - key: PRICE_MIN_READINGS
        value: "3"
      - key: PRICE_MIN_MARKETS
        value: "2"
      - key: PRICE_ANOMALY_THRESHOLD
        value: "0.15"
      - key: RESALE_COMMISSION_RATE
        value: "0.05"
      - key: VENDOR_COMMISSION_RATE
        value: "0.08"
      - key: VENDOR_PRICE_BAND
        value: "0.10"
      - key: MOMO_MERCHANT_NAME
        value: "OBP Market"
      - key: MOMO_MTN_NUMBER
        sync: false
      - key: MOMO_MOOV_NUMBER
        sync: false
      - key: NYOLE_SECRET_KEY
        sync: false
      - key: NYOLE_PUBLIC_KEY
        sync: false
      - key: NYOLE_API_BASE
        value: "https://app.nyole.com/api"
      - key: WEB_BASE_URL
        sync: false

databases:
  - name: obp-market-db
    plan: free
